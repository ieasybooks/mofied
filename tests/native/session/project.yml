name: MofiedSessionQA
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  SessionHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mofied.sessionqa.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  SessionTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SessionHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mofied.sessionqa.tests
        TEST_TARGET_NAME: SessionHost
schemes:
  MofiedSessionQA:
    build:
      targets:
        SessionHost: all
        SessionTests: [test]
    test:
      targets: [SessionTests]
