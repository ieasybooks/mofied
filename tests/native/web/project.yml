name: MofiedWebQA
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  QAHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mofied.webqa.host
        INFOPLIST_KEY_CFBundleDisplayName: Mofied Web QA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  QATests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: QAHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mofied.webqa.tests
        TEST_TARGET_NAME: QAHost
schemes:
  MofiedWebQA:
    build:
      targets:
        QAHost: all
        QATests: [test]
    test:
      targets: [QATests]
