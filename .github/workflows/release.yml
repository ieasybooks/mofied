name: Release apps

# Releases Mofied's apps to the App Store, Google Play and AppGallery: each
# store reviews them and publishes them once approved. release-please.yml calls
# it with the tag (such as v0.1.3) it made for a merged release pull request
# and the commit it tagged, once main's checks passed on that commit. Pushing a
# version tag runs it too, for a commit whose checks passed on main (its
# "Checks" status). Every job builds exactly that commit. The web has its own
# workflow (web.yml). See docs/releasing.md.
#
# Any other v* tag (such as v0-dry-run), or a run started by hand with
# dry-run ticked, is a dry run: it builds and signs both apps and has each
# store check what it would receive, but submits nothing. A release that a
# newer apps release has superseded stops before each upload, so re-running an
# older release can't replace a newer one in the stores. The vault serves the
# release secrets only to this workflow on v* tags and to its jobs that
# release-please.yml on main calls, started by AliOsm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and check everything, but release nothing
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: The version tag to release, such as v0.1.3
        type: string
        required: false
      sha:
        description: The commit the tag was made at, which every job checks out
        type: string
        required: false
      access-check:
        description: Only check the vault gives this workflow the store secrets and not the web's deploy token
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time. The vault access check has its own group: GitHub
# keeps only the newest waiting run in a group, cancelling the one it
# replaces, so a check waiting here would cancel a release waiting here.
concurrency:
  group: ${{ inputs.access-check && 'release-access-check' || 'release' }}
  cancel-in-progress: false

env:
  FASTLANE_OPT_OUT_USAGE: "YES"
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  check:
    name: Check
    if: ${{ !inputs.access-check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: read
    outputs:
      dry-run: ${{ steps.mode.outputs.dry-run }}
      tag: ${{ steps.mode.outputs.tag }}
      sha: ${{ steps.mode.outputs.sha }}
    steps:
      - name: Release or dry run
        id: mode
        env:
          CALLED_TAG: ${{ inputs.tag }}
          CALLED_SHA: ${{ inputs.sha }}
          DISPATCHED_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          called=false
          if [ -n "$CALLED_TAG" ]; then
            # From release-please.yml, which runs on main and passes the
            # commit it tagged.
            if ! [[ $CALLED_SHA =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::release-please.yml passed the tag $CALLED_TAG without its commit."
              exit 1
            fi
            tag=$CALLED_TAG
            sha=$CALLED_SHA
            dry_run=false
            called=true
          elif [[ $GITHUB_REF != refs/tags/v* ]]; then
            echo "::error::Run the release workflow on a v* tag; the vault serves the release secrets only there."
            exit 1
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag=$GITHUB_REF_NAME
            sha=$GITHUB_SHA
            dry_run=$DISPATCHED_DRY_RUN
          elif [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tag=$GITHUB_REF_NAME
            sha=$GITHUB_SHA
            dry_run=false
          else
            tag=$GITHUB_REF_NAME
            sha=$GITHUB_SHA
            dry_run=true
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "dry-run=$dry_run"
            echo "called=$called"
          } >> "$GITHUB_OUTPUT"
          if [ "$dry_run" = true ]; then
            echo "A dry run of $tag ($sha): nothing goes to the stores."
          else
            echo "Releasing $tag ($sha) to the stores."
          fi
      # Every job checks out this exact commit, never the tag by name: a
      # branch named like the tag would win, and a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.mode.outputs.sha }}
          persist-credentials: false
      # The tag still points at that commit, and a tag pushed by hand is on
      # a commit main's checks passed (release-please.yml checked its own).
      - name: Check the tag's commit
        if: steps.mode.outputs.dry-run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
          SHA: ${{ steps.mode.outputs.sha }}
          CALLED: ${{ steps.mode.outputs.called }}
        run: |
          if [ "$CALLED" = true ]; then
            scripts/release/verify-release-commit.sh "$TAG" "$SHA"
          else
            scripts/release/verify-release-commit.sh "$TAG" "$SHA" --checked
          fi
      # Each job that uploads checks again, for a re-run of only that job.
      - name: Check no newer release has replaced it
        if: steps.mode.outputs.dry-run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: scripts/release/check-not-superseded.sh "$TAG"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Check the tag, version and store listing
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry-run }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            bun scripts/release/check-release.ts
          else
            bun scripts/release/check-release.ts --tag "$TAG"
          fi
      - run: bun run typecheck
      - run: bun run test

  ios:
    name: Build iOS
    needs: check
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.check.outputs.dry-run }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Check no newer release has replaced it
        if: needs.check.outputs.dry-run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: scripts/release/check-not-superseded.sh "$TAG"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Generate the Xcode project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          secrets: APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
          files: APPLE_API_KEY.json
          base64-files: APPLE_DISTRIBUTION_CERTIFICATE.p12
      - name: Sign, build and upload to App Store Connect
        run: bundle exec fastlane ios build dry_run:"$DRY_RUN"
      # Kept like Android's, even when the upload failed after the build.
      - name: Describe the build
        if: ${{ !cancelled() }}
        env:
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          mkdir -p build/release
          jq -n \
            --arg commit "$SHA" --arg tag "$TAG" --argjson dryRun "$DRY_RUN" \
            --argjson app "$(bun scripts/release/release-info.ts)" \
            --arg xcode "$(xcodebuild -version | paste -sd ' ' -)" \
            --arg fastlane "$(awk '/^    fastlane \(/ { gsub(/[()]/, "", $2); print $2 }' Gemfile.lock)" \
            '{commit: $commit, tag: $tag, dryRun: $dryRun, version: $app.version, buildNumber: $app.iosBuildNumber, xcode: $xcode, fastlane: $fastlane}' \
            > build/release/release.json
          cat build/release/release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ios
          path: |
            build/release/*.ipa
            build/release/*.dSYM.zip
            build/release/release.json
          if-no-files-found: warn
          retention-days: 14

  app-store:
    name: App Store
    needs: [check, ios]
    runs-on: ubuntu-latest
    # Apple usually processes an upload within half an hour, sometimes hours.
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.check.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Check no newer release has replaced it
        if: needs.check.outputs.dry-run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: scripts/release/check-not-superseded.sh "$TAG"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bun scripts/release/write-fastlane-metadata.ts "$RUNNER_TEMP/store"
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          files: APPLE_API_KEY.json
      - name: Send the listing and submit for review
        env:
          STORE_METADATA_DIR: ${{ runner.temp }}/store
        run: bundle exec fastlane ios submit dry_run:"$DRY_RUN"

  android:
    name: Build Android
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # Gradle's downloads, from the cache check.yml saves on main: the same
      # steps before this one give the same key, and a tag run can read it but
      # not write it. The basic provider is actions/cache; the default one is
      # proprietary and only a preview for private repositories.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Generate the Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          secrets: MOFIED_ANDROID_KEYSTORE_PASSWORD
          base64-files: MOFIED_ANDROID_KEYSTORE.p12
      - name: Build the AAB and APK
        working-directory: apps/mobile/android
        # No 32-bit x86: no phone runs it, and each architecture adds C++ build time.
        run: ./gradlew --no-daemon bundleRelease assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
      - name: Check they're signed with Mofied's key
        env:
          # MOFIED_ANDROID_KEYSTORE's certificate, which Google Play and AppGallery know.
          SHA256: 2C:F5:F2:29:E9:35:C4:BA:6A:D9:D4:38:54:A1:8B:BB:4A:41:23:8E:AB:AA:CD:40:D1:EA:49:1A:D2:E9:AB:37
        run: |
          set -euo pipefail
          name=$(bun scripts/release/release-info.ts | jq -r '"mofied-\(.version)-\(.androidVersionCode)"')
          mkdir -p build/release
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "build/release/$name.aab"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "build/release/$name.apk"
          keytool -printcert -jarfile "build/release/$name.aab" | grep -q "SHA256: $SHA256" ||
            { echo "::error::The AAB isn't signed with Mofied's key."; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -1)/apksigner
          digest=$(echo "$SHA256" | tr -d : | tr A-F a-f)
          "$apksigner" verify --print-certs "build/release/$name.apk" | grep -q "SHA-256 digest: $digest" ||
            { echo "::error::The APK isn't signed with Mofied's key."; exit 1; }
          echo "Both are signed with Mofied's key."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: build/release/
          if-no-files-found: error
          retention-days: 14

  google-play:
    name: Google Play
    needs: [check, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.check.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Check no newer release has replaced it
        if: needs.check.outputs.dry-run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: scripts/release/check-not-superseded.sh "$TAG"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: build/release
      - run: bun scripts/release/write-fastlane-metadata.ts "$RUNNER_TEMP/store"
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          files: GOOGLE_PLAY_SERVICE_ACCOUNT.json
      - name: Upload to production with the listing
        env:
          STORE_METADATA_DIR: ${{ runner.temp }}/store
        run: bundle exec fastlane android publish aab:"$(ls build/release/*.aab)" dry_run:"$DRY_RUN"

  appgallery:
    name: AppGallery
    needs: [check, android]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.check.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Check no newer release has replaced it
        if: needs.check.outputs.dry-run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: scripts/release/check-not-superseded.sh "$TAG"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: build/release
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          secrets: APPGALLERY_CONNECT_SERVICE_ACCOUNT
      - name: Upload and submit for review
        run: |
          if [ "$DRY_RUN" = true ]; then
            bun scripts/release/publish-appgallery.ts build/release/*.apk --dry-run
          else
            bun scripts/release/publish-appgallery.ts build/release/*.apk
          fi

  # release-please.yml's vault access check (docs/releasing.md): this
  # workflow's jobs get the store secrets and not the web's deploy token.
  # It deploys and prints nothing.
  access-check:
    name: Vault access check
    if: ${{ inputs.access-check }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          secrets: APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD=STORE_SECRET
      - name: The vault serves the store secrets here
        run: test -n "$STORE_SECRET" && echo "The vault served APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD."
      - name: The vault refuses the web's deploy token here
        run: scripts/release/expect-vault-refusal.sh MOFIED_WEB_DEPLOY_TOKEN
