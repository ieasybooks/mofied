name: Release

# Pushing a version tag such as v0.1.3 releases Mofied to the App Store,
# Google Play and AppGallery: each store reviews it and publishes it once
# approved. See docs/releasing.md.
#
# Any other v* tag (such as v0-dry-run), or a run started by hand with
# dry-run ticked, is a dry run: it builds and signs both apps and has each
# store check what it would receive, but submits nothing. The vault serves the
# release secrets only to this workflow on v* tags, started by AliOsm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and check everything, but release nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FASTLANE_OPT_OUT_USAGE: "YES"
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dry-run: ${{ steps.mode.outputs.dry-run }}
    steps:
      - name: Release or dry run
        id: mode
        env:
          DISPATCHED_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ $GITHUB_REF != refs/tags/v* ]]; then
            echo "::error::Run the release workflow on a v* tag; the vault serves the release secrets only there."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            dry_run=$DISPATCHED_DRY_RUN
          elif [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            dry_run=false
          else
            dry_run=true
          fi
          echo "dry-run=$dry_run" >> "$GITHUB_OUTPUT"
          if [ "$dry_run" = true ]; then
            echo "A dry run: nothing goes to the stores."
          else
            echo "Releasing $GITHUB_REF_NAME to the stores."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Check the tag, version, build numbers and store/
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            bun scripts/release/check-release.ts
          else
            bun scripts/release/check-release.ts --tag "$GITHUB_REF_NAME"
          fi
      - run: bun run typecheck
      - run: bun run test

  ios:
    name: Build iOS
    needs: check
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.check.outputs.dry-run }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Generate the Xcode project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          secrets: APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
          files: APPLE_API_KEY.json
          base64-files: APPLE_DISTRIBUTION_CERTIFICATE.p12
      - name: Sign, build and upload to App Store Connect
        run: bundle exec fastlane ios build dry_run:"$DRY_RUN"

  app-store:
    name: App Store
    needs: [check, ios]
    runs-on: ubuntu-latest
    # Apple usually processes an upload within half an hour, sometimes hours.
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.check.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bun scripts/release/write-fastlane-metadata.ts "$RUNNER_TEMP/store"
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          files: APPLE_API_KEY.json
      - name: Send the listing and submit for review
        env:
          STORE_METADATA_DIR: ${{ runner.temp }}/store
        run: bundle exec fastlane ios submit dry_run:"$DRY_RUN"

  android:
    name: Build Android
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # Gradle's downloads and build outputs, from main's cache: a tag run can
      # read it but not write it. The basic provider is actions/cache; the
      # default one is proprietary and only a preview for private repositories.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Generate the Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          secrets: MOFIED_ANDROID_KEYSTORE_PASSWORD
          base64-files: MOFIED_ANDROID_KEYSTORE.p12
      - name: Build the AAB and APK
        working-directory: apps/mobile/android
        # No 32-bit x86: no phone runs it, and each architecture adds C++ build time.
        run: ./gradlew --no-daemon bundleRelease assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
      - name: Check they're signed with Mofied's key
        env:
          # MOFIED_ANDROID_KEYSTORE's certificate, which Google Play and AppGallery know.
          SHA256: 2C:F5:F2:29:E9:35:C4:BA:6A:D9:D4:38:54:A1:8B:BB:4A:41:23:8E:AB:AA:CD:40:D1:EA:49:1A:D2:E9:AB:37
        run: |
          set -euo pipefail
          name=mofied-$(jq -r .version package.json)-$(jq -r .expo.android.versionCode apps/mobile/app.json)
          mkdir -p build/release
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "build/release/$name.aab"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "build/release/$name.apk"
          keytool -printcert -jarfile "build/release/$name.aab" | grep -q "SHA256: $SHA256" ||
            { echo "::error::The AAB isn't signed with Mofied's key."; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -1)/apksigner
          digest=$(echo "$SHA256" | tr -d : | tr A-F a-f)
          "$apksigner" verify --print-certs "build/release/$name.apk" | grep -q "SHA-256 digest: $digest" ||
            { echo "::error::The APK isn't signed with Mofied's key."; exit 1; }
          echo "Both are signed with Mofied's key."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: build/release/
          if-no-files-found: error
          retention-days: 14

  google-play:
    name: Google Play
    needs: [check, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.check.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: build/release
      - run: bun scripts/release/write-fastlane-metadata.ts "$RUNNER_TEMP/store"
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          files: GOOGLE_PLAY_SERVICE_ACCOUNT.json
      - name: Upload to production with the listing
        env:
          STORE_METADATA_DIR: ${{ runner.temp }}/store
        run: bundle exec fastlane android publish aab:"$(ls build/release/*.aab)" dry_run:"$DRY_RUN"

  appgallery:
    name: AppGallery
    needs: [check, android]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.check.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: build/release
      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        with:
          secrets: APPGALLERY_CONNECT_SERVICE_ACCOUNT
      - name: Upload and submit for review
        run: |
          if [ "$DRY_RUN" = true ]; then
            bun scripts/release/publish-appgallery.ts build/release/*.apk --dry-run
          else
            bun scripts/release/publish-appgallery.ts build/release/*.apk
          fi
