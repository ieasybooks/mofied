name: Check

# Every check, on pull requests, and on main through release-please.yml, which
# calls this with the commit it would release (or the one pushed) and ships
# only once these pass. Every checkout takes that commit: inputs.sha is empty
# on pull requests, which check out their merge commit.
on:
  pull_request:
  workflow_call:
    inputs:
      sha:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Runs on main each
# get their own group: a release waits on its run, which nothing may cancel.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      # The fastlane lanes' own logic, on plain Ruby: no gems, no Apple.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - run: bun run test:fastlane
      - run: bun run contract:generate && git diff --exit-code -- docs/session.schema.json docs/session.example.json
      - run: bun run mobile:export
      - run: bunx playwright install --with-deps chromium
      - run: xvfb-run -a bun run test:e2e
        env:
          HEADED: "1"
      - name: Check Cloudflare asset deployment
        run: bun run deploy:web:check && xvfb-run -a bun run test:cloudflare
        env:
          HEADED: "1"
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Before setup-gradle: the cache key hashes the packages' Gradle files.
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # The runner has the Android SDK. Gradle's downloads are cached from
      # main, where release.yml's Android build reads them too: the same
      # steps before this one give it the same cache key. The basic provider
      # is actions/cache; the default one is only a preview for private
      # repositories.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - run: bunx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: apps/mobile/android

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:native-cache
      - run: bunx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Build iOS simulator app without signing
        shell: bash
        run: |
          mofied_workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          mofied_scheme=$(python3 -c 'from pathlib import Path; print(next(Path(".").glob("*.xcodeproj/xcshareddata/xcschemes/*.xcscheme")).stem)')
          xcodebuild -workspace "$mofied_workspace" -scheme "$mofied_scheme" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile/ios
