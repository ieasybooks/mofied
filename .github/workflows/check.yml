name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run contract:generate && git diff --exit-code -- docs/session.schema.json docs/session.example.json
      - run: bun run mobile:export
      - run: bunx playwright install --with-deps chromium
      - run: xvfb-run -a bun run test:e2e
        env:
          HEADED: "1"
      - name: Check Cloudflare asset deployment
        run: bun run deploy:web:check && xvfb-run -a bun run test:cloudflare
        env:
          HEADED: "1"
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: apps/mobile/android

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:native-cache
      - run: bunx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Build iOS simulator app without signing
        shell: bash
        run: |
          mofied_workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          mofied_scheme=$(python3 -c 'from pathlib import Path; print(next(Path(".").glob("*.xcodeproj/xcshareddata/xcschemes/*.xcscheme")).stem)')
          xcodebuild -workspace "$mofied_workspace" -scheme "$mofied_scheme" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile/ios
