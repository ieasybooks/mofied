name: Release web

# Deploys mofied.com, then checks that the site serves the new build.
# release-please.yml calls it with the tag (such as web-v0.1.3) it made for a
# merged release pull request and the commit it tagged, once main's checks
# passed on that commit. Pushing a web version tag, or running it by hand on
# one, deploys that version too, for a commit whose checks passed on main (its
# "Checks" status). The web's version is apps/web/package.json's; the apps
# release from release.yml. See docs/web-deployment.md.
#
# On any other ref, such as a web-v0-dry-run tag or main, it's a dry run: it
# builds the web and has Wrangler check the upload, but deploys nothing. A
# release that a newer web release has superseded stops before it deploys, so
# re-running an older release, or one whose checks finished after a newer
# one's, can't put an older version back; going back is a rollback
# (docs/releasing.md). The vault serves the web's deploy token only to
# this workflow on web-v* tags and to its jobs that release-please.yml on main
# calls, started by AliOsm.
on:
  push:
    tags: ["web-v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The web version tag to deploy, such as web-v0.1.3
        type: string
        required: false
      sha:
        description: The commit the tag was made at, which the job checks out
        type: string
        required: false
      access-check:
        description: Only check the vault gives this workflow the web's deploy token and not the store secrets
        type: boolean
        default: false

permissions:
  contents: read

# One deployment at a time, each waiting its turn: queue: max keeps up to 100
# waiting, where GitHub would cancel all but the newest, which can be an older
# release whose checks finished later (it then stops as superseded, and
# nothing deploys). The vault access check has its own group, so it doesn't
# wait behind a deployment.
concurrency:
  group: ${{ inputs.access-check && 'release-web-access-check' || 'release-web' }}
  queue: max
  cancel-in-progress: false

jobs:
  web:
    name: Web
    if: ${{ !inputs.access-check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      statuses: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Release or dry run
        id: mode
        env:
          CALLED_TAG: ${{ inputs.tag }}
          CALLED_SHA: ${{ inputs.sha }}
        run: |
          called=false
          if [ -n "$CALLED_TAG" ]; then
            # From release-please.yml, which runs on main and passes the
            # commit it tagged.
            if ! [[ $CALLED_SHA =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::release-please.yml passed the tag $CALLED_TAG without its commit."
              exit 1
            fi
            tag=$CALLED_TAG
            sha=$CALLED_SHA
            called=true
          else
            tag=$GITHUB_REF_NAME
            sha=$GITHUB_SHA
          fi
          if [ "$called" = true ] || [[ $GITHUB_REF =~ ^refs/tags/web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
            echo "Deploying $tag ($sha) to mofied.com."
          else
            echo "dry-run=true" >> "$GITHUB_OUTPUT"
            echo "A dry run of $tag ($sha): nothing is deployed."
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "called=$called"
          } >> "$GITHUB_OUTPUT"
      # This exact commit, never the tag by name: a branch named like the tag
      # would win, and a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.mode.outputs.sha }}
          persist-credentials: false
      - name: Check the tag matches the version
        if: steps.mode.outputs.dry-run == 'false'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          version=$(jq -r .version apps/web/package.json)
          if [ "$TAG" != "web-v$version" ]; then
            echo "::error::The tag $TAG doesn't match apps/web/package.json's version $version; tag web-v$version."
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # From ieasybooks/release, pinned in bun.lock.
      # The tag still points at that commit, and a tag pushed by hand is on a
      # commit main's checks passed (release-please.yml checked its own).
      - name: Check the tag's commit
        if: steps.mode.outputs.dry-run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
          SHA: ${{ steps.mode.outputs.sha }}
          CALLED: ${{ steps.mode.outputs.called }}
        run: |
          if [ "$CALLED" = true ]; then
            ./node_modules/.bin/ieasybooks-release verify-commit "$TAG" "$SHA"
          else
            ./node_modules/.bin/ieasybooks-release verify-commit "$TAG" "$SHA" --checked
          fi
      # While this workflow holds the release-web group, so a newer release
      # either deployed before this one or waits for it.
      - name: Check no newer release has replaced it
        if: steps.mode.outputs.dry-run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: ./node_modules/.bin/ieasybooks-release not-superseded "$TAG"
      - run: bun run typecheck
      - run: bun run test

      - name: Build and check the deployment
        if: steps.mode.outputs.dry-run == 'true'
        run: bun run deploy:web:check

      # A token that can deploy mofied-web and no other Worker.
      - uses: ieasybooks/vault@1bce5652d3d2461b0c6d590c3358d8c877fe61c8 # v1.1.0
        if: steps.mode.outputs.dry-run == 'false'
        with:
          secrets: MOFIED_WEB_DEPLOY_TOKEN=CLOUDFLARE_API_TOKEN
      - name: Build and deploy mofied.com
        if: steps.mode.outputs.dry-run == 'false'
        run: bun run deploy:web
      - name: Check mofied.com serves it
        if: steps.mode.outputs.dry-run == 'false'
        run: scripts/release/check-live-web.sh

  # release-please.yml's vault access check (docs/releasing.md): this
  # workflow's jobs get the web's deploy token and not the store secrets. It
  # deploys and prints nothing.
  access-check:
    name: Vault access check
    if: ${{ inputs.access-check }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ieasybooks/vault@1bce5652d3d2461b0c6d590c3358d8c877fe61c8 # v1.1.0
        with:
          secrets: MOFIED_WEB_DEPLOY_TOKEN=DEPLOY_TOKEN
      - name: The vault serves the web's deploy token here
        run: test -n "$DEPLOY_TOKEN" && echo "The vault served MOFIED_WEB_DEPLOY_TOKEN."
      # Asked for alone, it must be refused because no rule matches.
      - name: The vault refuses the store secrets here
        uses: ieasybooks/vault@1bce5652d3d2461b0c6d590c3358d8c877fe61c8 # v1.1.0
        with:
          expect-refused: APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
