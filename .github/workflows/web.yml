name: Release web

# Deploys mofied.com, then checks that the site serves the new build.
# release-please.yml calls it with the tag (such as web-v0.1.3) it made for a
# merged release pull request; pushing a web version tag, or running it by hand
# on one, deploys that version too. The web's version is apps/web/package.json's;
# the apps release from release.yml. See docs/web-deployment.md.
#
# On any other ref, such as a web-v0-dry-run tag or main, it's a dry run: it
# builds the web and has Wrangler check the upload, but deploys nothing. The
# vault serves the deploy token only to this workflow on web-v* tags and to
# release-please.yml on main, started by AliOsm.
on:
  push:
    tags: ["web-v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The web version tag to deploy, such as web-v0.1.3
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-web
  cancel-in-progress: false

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Release or dry run
        id: mode
        env:
          CALLED_TAG: ${{ inputs.tag }}
        run: |
          # The tag release-please.yml passed (it runs on main), or the ref
          # this ran on.
          tag=${CALLED_TAG:-$GITHUB_REF_NAME}
          if [ -n "$CALLED_TAG" ] || [[ $tag =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
            echo "Deploying $tag to mofied.com."
          else
            echo "dry-run=true" >> "$GITHUB_OUTPUT"
            echo "A dry run of $tag: nothing is deployed."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # inputs.tag is empty unless release-please.yml called this, so a pushed
      # tag checks out the commit it ran on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Check the tag matches the version
        if: steps.mode.outputs.dry-run == 'false'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          version=$(jq -r .version apps/web/package.json)
          if [ "$TAG" != "web-v$version" ]; then
            echo "::error::The tag $TAG doesn't match apps/web/package.json's version $version; tag web-v$version."
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      - name: Build and check the deployment
        if: steps.mode.outputs.dry-run == 'true'
        run: bun run deploy:web:check

      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        if: steps.mode.outputs.dry-run == 'false'
        with:
          secrets: CLOUDFLARE_WORKERS_DEPLOY_TOKEN=CLOUDFLARE_API_TOKEN
      - name: Build and deploy mofied.com
        if: steps.mode.outputs.dry-run == 'false'
        run: bun run deploy:web
      - name: Check mofied.com serves it
        if: steps.mode.outputs.dry-run == 'false'
        run: scripts/release/check-live-web.sh
