name: Release web

# Pushing a web version tag such as web-v0.1.3 deploys mofied.com, then checks
# that the site serves the new build. The web and the apps share
# package.json's version: web-v<version> releases the web, v<version> the apps
# (release.yml), and a release of both gets both tags. See
# docs/web-deployment.md.
#
# Any other web-v* tag (such as web-v0-dry-run) is a dry run: it builds the web
# and has Wrangler check the upload, but deploys nothing. The vault serves the
# deploy token only to this workflow on web-v* tags, started by AliOsm.
on:
  push:
    tags: ["web-v*"]

permissions:
  contents: read

concurrency:
  group: release-web
  cancel-in-progress: false

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Release or dry run
        id: mode
        run: |
          if [[ $GITHUB_REF_NAME =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
            echo "Deploying $GITHUB_REF_NAME to mofied.com."
          else
            echo "dry-run=true" >> "$GITHUB_OUTPUT"
            echo "A dry run: nothing is deployed."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version
        if: steps.mode.outputs.dry-run == 'false'
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "web-v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match package.json's version $version; tag web-v$version."
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      - name: Build and check the deployment
        if: steps.mode.outputs.dry-run == 'true'
        run: bun run deploy:web:check

      - uses: ieasybooks/vault@4900bee8cf4a356501cbd69c19e25d67bd21334c # v1.0.0
        if: steps.mode.outputs.dry-run == 'false'
        with:
          secrets: CLOUDFLARE_WORKERS_DEPLOY_TOKEN=CLOUDFLARE_API_TOKEN
      - name: Build and deploy mofied.com
        if: steps.mode.outputs.dry-run == 'false'
        run: bun run deploy:web
      - name: Check mofied.com serves it
        if: steps.mode.outputs.dry-run == 'false'
        run: scripts/release/check-live-web.sh
